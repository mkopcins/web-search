<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Results</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f7f7f8;
            color: #1a1a1a;
            padding: 16px;
            line-height: 1.4;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #e5e5e7;
        }
        .header-icon {
            width: 24px; height: 24px;
            background: #fb542b;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 700; font-size: 14px;
        }
        .header-text { font-size: 13px; color: #666; }
        .query { font-weight: 600; color: #1a1a1a; }
        .result {
            background: white;
            border-radius: 10px;
            padding: 12px 14px;
            margin-bottom: 10px;
            border: 1px solid #e5e5e7;
        }
        .result-title {
            font-size: 15px;
            font-weight: 600;
            color: #1a73e8;
            margin-bottom: 4px;
            text-decoration: none;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
        .result-url {
            font-size: 11px;
            color: #5f6368;
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .result-age {
            display: inline-block;
            font-size: 10px;
            background: #f0f0f3;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 6px;
            color: #666;
        }
        .result-desc {
            font-size: 13px;
            color: #3c4043;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
        }
        .empty { text-align: center; color: #888; padding: 40px 0; }
        @media (prefers-color-scheme: dark) {
            body { background: #1a1a1a; color: #e5e5e7; }
            .header { border-bottom-color: #333; }
            .header-text { color: #999; }
            .query { color: #e5e5e7; }
            .result { background: #2a2a2c; border-color: #333; }
            .result-title { color: #8ab4f8; }
            .result-url { color: #999; }
            .result-age { background: #333; color: #ccc; }
            .result-desc { color: #c5c5c7; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-icon">B</div>
        <div class="header-text">Results for <span class="query" id="query"></span></div>
    </div>
    <div id="results"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const query = params.get('q') || '';
        document.getElementById('query').textContent = `"${query}"`;
        try {
            const data = JSON.parse(decodeURIComponent(params.get('data') || '[]'));
            const container = document.getElementById('results');
            if (!data.length) {
                container.innerHTML = '<div class="empty">No results found.</div>';
            } else {
                container.innerHTML = data.map(r => {
                    const safeTitle = (r.title || '').replace(/</g, '&lt;');
                    const safeDesc = (r.description || '').replace(/</g, '&lt;');
                    const safeUrl = (r.url || '').replace(/</g, '&lt;');
                    const ageBadge = r.age ? `<span class="result-age">${r.age.replace(/</g, '&lt;')}</span>` : '';
                    return `
                        <div class="result">
                            <div class="result-title">${safeTitle}</div>
                            <div class="result-url">${safeUrl}</div>
                            ${ageBadge}
                            <div class="result-desc">${safeDesc}</div>
                        </div>
                    `;
                }).join('');
            }
        } catch (e) {
            document.getElementById('results').innerHTML = '<div class="empty">Failed to render results.</div>';
        }
    </script>
</body>
</html>
